# One origin for the browser: static console, REST API, WebSocket events and sign-in. No CORS needed.
# Round-robin across every `api` replica; no sticky sessions, because the events namespace accepts
# WebSocket only (ADR-0008). `resolve` re-reads Docker's DNS, so replicas added, removed or
# recreated with a new IP are picked up without restarting nginx.
# 127.0.0.11 is Docker's embedded DNS, which exists only on a Compose / user-defined network.
# Running this image anywhere else needs a different resolver (IMP-18).
upstream api_backend {
  zone api_backend 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server api:3000 resolve;
}

# `resolve` here too: nginx starts even while Keycloak is not up yet.
upstream keycloak_backend {
  zone keycloak_backend 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server keycloak:8080 resolve;
}

# Client address (ADR-0012): nginx is the one place that decides it. Every upstream gets
# `X-Forwarded-For: $remote_addr`, overwritten rather than appended, so a client cannot plant its
# own value, and the API trusts exactly this one hop (TRUST_PROXY_HOPS=1).
# Load balancer or TLS terminator in front of this nginx: mount /etc/nginx/conf.d/real-ip.conf with
#   set_real_ip_from <LB CIDR>; real_ip_header X-Forwarded-For; real_ip_recursive on;
# so $remote_addr becomes the real client, but only for hops from that CIDR. Off by default:
# in Compose this nginx is the edge.

# Edge rate limits (ADR-0012), per client address and counted once for every API replica behind
# this nginx. A coarse flood brake for what the API cannot key by user: requests without a valid
# token, and /events handshakes, each of which costs an RS256 check. Per-user limits are the API's.
# Sized for a whole control room behind one NAT address, every console reconnecting at once.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=events_per_ip:1m rate=2r/s;

# `path` in the 429 body: the request path up to the first character that could break the JSON
# (quotes, backslashes) or the query string. Percent-encoded characters stay encoded.
map $request_uri $rate_limited_path {
  "~^(?<safe>[A-Za-z0-9/._~%-]*)" $safe;
  default "/";
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Only nginx's own 429s land here; the API's pass through as they are (no proxy_intercept_errors).
  limit_req_status 429;
  error_page 429 = @rate_limited;

  location /api/ {
    limit_req zone=api_per_ip burst=200 nodelay;
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /socket.io/ {
    limit_req zone=events_per_ip burst=30 nodelay;
    proxy_pass http://api_backend;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Keycloak (ADR-0010). It builds its URLs and the token issuer from the forwarded host, so pass
  # the browser's Host with its port ($http_host), not nginx's own ($host drops the port).
  location /auth/ {
    proxy_pass http://keycloak_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Keycloak's session cookies outgrow the default buffer: 502 "upstream sent too big header".
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # The API's error body (`ApiError` in @occ/contracts), so clients handle both 429s alike.
  location @rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"statusCode":429,"error":"TOO_MANY_REQUESTS","message":"Too many requests. Try again shortly.","path":"$rate_limited_path","timestamp":"$time_iso8601"}';
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
