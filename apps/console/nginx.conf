# One origin for the browser: static console, REST API and WebSocket events. No CORS needed.
# Round-robin across every `api` replica; no sticky sessions, because the events namespace accepts
# WebSocket only (ADR-0008). `resolve` re-reads Docker's DNS, so replicas added, removed or
# recreated with a new IP are picked up without restarting nginx.
# 127.0.0.11 is Docker's embedded DNS, which exists only on a Compose / user-defined network.
# Running this image anywhere else needs a different resolver (IMP-18).
upstream api_backend {
  zone api_backend 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server api:3000 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
