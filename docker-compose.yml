# One command, whole stack:  docker compose up --build   →  http://localhost:18080
name: ops-command-center

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ops
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only, for `pnpm dev` on the host; remap with POSTGRES_PORT if 15432 is taken.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ops']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ops
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-8000}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-mock}
      # The image runs NODE_ENV=production, which refuses mock cameras and seeding unless the
      # deploy opts in. This stack is the demo, so it does (ADR-0006).
      DEMO_MODE: ${DEMO_MODE:-true}
      # Demo stack, not production: keep /api/docs on. The image runs NODE_ENV=production,
      # so "Try it out" stays disabled (ADR-0005).
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    # No host port: the API (docs included) is reached through the console on :18080, which
    # balances across replicas. That is what lets `docker compose up --scale api=2` work (ADR-0008).

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '18080:80'

volumes:
  pgdata:
