# One command, whole stack:  docker compose up --build   →  http://localhost:18080
name: ops-command-center

services:
  postgres:
    image: postgres:17-alpine
    # Demo credentials, not a template for any other environment (ADR-0006). POSTGRES_PASSWORD only
    # takes effect when the pgdata volume is first created; the api reads the same value as its
    # DB_PASSWORD.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ops
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only, for `pnpm dev` on the host; remap with POSTGRES_PORT if 15432 is taken.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ops']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Demo credentials, same as the postgres service (ADR-0006).
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ops
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-8000}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-mock}
      # No default in the API's production mode, so a forgotten value fails boot; the demo has one.
      TELEMETRY_SOURCE: ${TELEMETRY_SOURCE:-mock}
      # The demo shows frame 04's alarm: the mock source scripts a breach of two seeded rules on a
      # cycle. Off in the API's own default; inert under `mqtt` and `off` (ADR-0019).
      TELEMETRY_MOCK_SCENARIO: ${TELEMETRY_MOCK_SCENARIO:-true}
      # Passed through so a demo volume can keep less than a week of 5 s samples (ADR-0018).
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-7}
      # The image runs NODE_ENV=production, which refuses mock cameras, mock telemetry and seeding
      # unless the deploy opts in. This stack is the demo, so it does (ADR-0006).
      DEMO_MODE: ${DEMO_MODE:-true}
      # Stamped on every API log line as `env`; production requires it (ADR-0014). This stack is
      # the demo, so its logs never pass for staging's or production's.
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-demo}
      # Demo stack, not production: keep /api/docs on. The image runs NODE_ENV=production,
      # so "Try it out" stays disabled (ADR-0005).
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # Every request needs a token from the realm below (ADR-0010). The issuer is the URL the
      # browser signs in through (Keycloak behind the console's nginx); set OCC_PUBLIC_URL when the
      # console is opened from another address (with CONSOLE_BIND, see `console`). Signing keys
      # come from Keycloak directly.
      OIDC_ISSUER: ${OCC_PUBLIC_URL:-http://localhost:18080}/auth/realms/occ
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/occ/protocol/openid-connect/certs
      OIDC_AUDIENCE: occ-api
      # Used only with TELEMETRY_SOURCE=mqtt; inert under `mock` and `off`. Demo credentials for the
      # `telemetry` profile's broker, not a template for any other environment (ADR-0006): a real
      # site sets its own broker and credentials.
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-occ-api}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-occ-demo-api}
    depends_on:
      postgres:
        condition: service_healthy
    # No depends_on keycloak: the API fetches signing keys on first use, so it boots and stays
    # healthy while Keycloak is down; only authenticated requests fail then (503).
    # No host port: the API (docs included) is reached through the console on :18080, which
    # balances across replicas. That is what lets `docker compose up --scale api=2` work (ADR-0008).

  # Demo identity provider (ADR-0010): dev mode, plain HTTP, demo users whose password is their
  # username. Not a production setup: a real deployment brings its own IdP and sets OIDC_*.
  # No volume: the realm is re-imported from ops/keycloak on every start, so it never drifts.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      # No fixed hostname: URLs and the token issuer follow the forwarded host, so sign-in works
      # through nginx (:18080) and the console's dev server (:15173) alike. The API still accepts
      # exactly one issuer (OIDC_ISSUER).
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./ops/keycloak:/opt/keycloak/data/import:ro
      # The `occ` login theme (V2-20.2), mounted as that one directory: `/opt/keycloak/themes` takes custom
      # themes without a build step and the built-in ones stay in Keycloak's own jar, so `keycloak.v2`
      # (its parent) still resolves. `start-dev` does not cache themes, so an edit shows on reload. A real
      # site mounts or packages its own theme with its own identity provider.
      - ./ops/keycloak/themes/occ:/opt/keycloak/themes/occ:ro
    # Loopback only, for `pnpm dev`; remap with KEYCLOAK_PORT if 18081 is taken.
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-18081}:8080'
    # The image has no curl or wget; bash's /dev/tcp asks the management port instead.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    # The models nginx serves at /models/ (ADR-0020 § Serving): the demo's stand-ins from ops/models,
    # read-only and not part of the image. A real deployment mounts its own directory here and sets
    # asset_class.model_key to the file names in it.
    volumes:
      - ./ops/models:/usr/share/nginx/models:ro
    # Loopback only by default, like postgres and keycloak: the demo users' passwords are their
    # usernames, so a LAN-reachable console lets anyone on the network sign in. To open it from
    # another machine, set CONSOLE_BIND=0.0.0.0 together with OCC_PUBLIC_URL.
    ports:
      - '${CONSOLE_BIND:-127.0.0.1}:18080:80'

  # Metrics (ADR-0015), opt-in: docker compose --profile observability up --build
  # Scrapes every api replica on its metrics port, which only this network reaches: the api
  # publishes no host port and nginx never proxies it. No volume: history lasts as long as the
  # container, which is enough for a demo.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  # Dashboards for the demo (ADR-0015): the provisioned "OCC API" dashboard is the home page.
  # Anonymous visitors get Viewer; the demo admin password is not a template for any other
  # environment (ADR-0006). Loopback only, like the console; remap with GRAFANA_PORT.
  grafana:
    image: grafana/grafana:13.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/occ-api.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-13001}:3000'
    depends_on:
      - prometheus

  # Demo MQTT broker (ADR-0019), opt-in:
  #   TELEMETRY_SOURCE=mqtt docker compose --profile telemetry up --build
  # A profile cannot change the `api` environment, hence the variable on the command line. No host
  # port: the broker is never public and no nginx route reaches it, so `pnpm dev` on the host does
  # not reach it either. The accounts and the ACL are generated at start from the simulator's
  # catalogue, so no password hash lives in the repo. No volume: the simulator republishes the
  # retained `status` messages when it connects. Demo credentials, not a template (ADR-0006).
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    profiles: [telemetry]
    entrypoint: ['/bin/sh', '/mosquitto/entrypoint.sh']
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-occ-api}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-occ-demo-api}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-occ-demo-device}
    volumes:
      - ./ops/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./ops/mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - ./ops/telemetry-sim/catalogue.json:/mosquitto/catalogue.json:ro
    # A TCP probe: a credential in a healthcheck command would show in `docker inspect`, and an
    # authentication or ACL fault shows in the simulator's and the api's logs.
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 1883']
      interval: 5s
      timeout: 3s
      retries: 10

  # Plays the demo devices over real MQTT (ADR-0019): the mock source's waveforms, one connection
  # per asset with its own account and last will. Stop it and the console marks every asset stale.
  telemetry-sim:
    build:
      context: .
      dockerfile: ops/telemetry-sim/Dockerfile
    profiles: [telemetry]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-occ-demo-device}
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  pgdata:
