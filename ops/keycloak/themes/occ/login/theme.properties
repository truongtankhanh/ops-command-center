# The `occ` login theme (V2-20.2, ADR-0010 "Settled in V2-20.1"). Checked against the Keycloak 26.8 image:
# `keycloak.v2` is the built-in login theme, and it sets `styles=css/styles.css`. A child's `styles`
# replaces the parent's value, so the parent's file is listed first and ours after it.
parent=keycloak.v2
styles=css/styles.css css/occ.css
locales=en
