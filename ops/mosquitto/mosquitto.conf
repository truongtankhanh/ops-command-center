# Demo broker for the `telemetry` Compose profile (ADR-0019). Plain MQTT on the Compose network
# only: no host port, no TLS, and nginx never routes it. A real site brings its own broker and
# exposes mqtts (8883) to its device network.
listener 1883

# Every account and ACL below is generated by entrypoint.sh at start, from the simulator's
# catalogue and the stack's demo credentials (ADR-0006). Nothing is committed.
allow_anonymous false
password_file /tmp/mosquitto-passwd
acl_file /tmp/mosquitto-acl

# Retained `status` messages are republished by the simulator on connect, so there is nothing
# worth keeping across a restart.
persistence false
log_dest stdout
