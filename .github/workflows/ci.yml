name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI can be switched off for the repository with the Actions variable CI_ENABLED=false
# (`pnpm ci:off`, back with `pnpm ci:on`). Unset or any other value means it runs. A skipped job
# counts as passed for a required check; `pnpm ci:local` runs the same steps on this machine.
jobs:
  verify:
    name: Lint, typecheck, test, build
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: ops_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Model checks
        run: |
          pnpm models:typecheck
          pnpm models:check
          pnpm models:test
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  images:
    name: Docker images
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Boot the stack with two API replicas
        run: docker compose up -d --wait --wait-timeout 180 --scale api=2
      - name: Check both replicas are healthy behind nginx
        run: |
          healthy=$(docker compose ps api --format '{{.Health}}' | grep -c '^healthy$')
          test "$healthy" -eq 2
          curl -fsS --retry 5 --retry-connrefused http://localhost:18080/api/health/ready
      # The scrape port is for the Compose network only (ADR-0015): nginx never proxies it, no host
      # port publishes it, and each replica serves it, labelled with its environment.
      - name: Check metrics stay off the edge and every replica serves them
        run: |
          # `bash -e` stops silently on a failed `test`, so each check names itself in the log.
          fail() { echo "::error::$1"; exit 1; }
          # `|| true`: an unreachable nginx makes curl exit non-zero; it still prints 000 as the code.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/api/metrics || true)
          test "$code" = 404 || fail "/api/metrics through nginx returned $code, want 404"
          # Ask the engine, not `docker compose port`: Compose lists an EXPOSEd port as published on 0
          # and prints `:0` for it. `docker port` prints only real host bindings, per replica.
          for id in $(docker compose ps -q api); do
            binding=$(docker port "$id" 9464 2>/dev/null || true)
            test -z "$binding" || fail "api container $id publishes 9464 on the host: $binding"
          done
          for replica in 1 2; do
            # Read whole before grep: `grep -q` exits early and pipefail would flag wget's SIGPIPE.
            body=$(docker compose exec -T --index "$replica" api wget -qO- http://127.0.0.1:9464/metrics) ||
              fail "api replica $replica does not serve /metrics on 9464"
            grep -q '^process_start_time_seconds{.*env="demo"' <<< "$body" ||
              fail "api replica $replica metrics lack process_start_time_seconds with env=\"demo\""
          done
      - name: Check nginx rate-limits the edge
        run: |
          for i in $(seq 1 50); do
            curl -s -o /tmp/body -w '%{http_code}\n' http://localhost:18080/socket.io/ > /tmp/code
            if grep -qx 429 /tmp/code; then break; fi
          done
          grep -qx 429 /tmp/code
          jq -e '.statusCode == 429 and .error == "TOO_MANY_REQUESTS"
                 and has("message") and has("path") and has("timestamp")' /tmp/body
      # /models/ (ADR-0020 § Serving): nginx serves only `<class>.<12 hex>.glb` from the mounted ops/models,
      # immutably, and answers everything else under /models/ with 404, never the SPA's index.html.
      - name: Check /models/ serves a hashed model immutably and nothing else
        run: |
          fail() { echo "::error::$1"; exit 1; }
          base=http://localhost:18080
          # The Compose mount is ./ops/models, so the checkout holds the names nginx can serve.
          set -- ops/models/*.glb
          test -e "$1" || fail "ops/models holds no .glb to request"
          model=$(basename "$1")
          class=${model%%.*}
          # `|| true`: an unreachable nginx makes curl exit non-zero; it still prints 000 as the code.
          get() { curl -s -o /tmp/models-body -D /tmp/models-headers -w '%{http_code}' "$base$1" || true; }
          header() { grep -i "^$1:" /tmp/models-headers | tr -d '\r' | cut -d: -f2- | sed 's/^ *//' || true; }

          code=$(get "/models/$model")
          test "$code" = 200 || fail "/models/$model returned $code, want 200"
          type=$(header content-type)
          test "$type" = model/gltf-binary || fail "/models/$model has Content-Type '$type', want model/gltf-binary"
          cache=$(header cache-control)
          case "$cache" in *immutable*) ;; *) fail "/models/$model has Cache-Control '$cache', want immutable" ;; esac
          cmp -s /tmp/models-body "ops/models/$model" || fail "/models/$model is not the file in ops/models"

          # A well-formed name of the class with another hash, an unknown name and the directory: 404, not the SPA.
          for path in "/models/$class.000000000000.glb" /models/nope.000000000000.glb /models/; do
            code=$(get "$path")
            test "$code" = 404 || fail "$path returned $code, want 404"
            ! grep -q 'id="root"' /tmp/models-body || fail "$path answered with the SPA page"
          done

          # The console's own routes are unaffected.
          code=$(get /campus/overview)
          test "$code" = 200 || fail "/campus/overview returned $code, want 200"
          grep -q 'id="root"' /tmp/models-body || fail "/campus/overview did not answer with the SPA page"
      # Last: it stops the database. Each replica must stay live and report not ready (ADR-0013).
      - name: Liveness survives a database outage
        run: |
          docker compose stop postgres
          probe() { docker compose exec -T --index "$1" api wget -qO /dev/null "http://127.0.0.1:3000/api/health/$2"; }
          for replica in 1 2; do
            if ! probe "$replica" live; then
              echo "::error::api replica $replica is not live with the database stopped"
              exit 1
            fi
            if probe "$replica" ready; then
              echo "::error::api replica $replica reports ready with the database stopped"
              exit 1
            fi
          done
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
