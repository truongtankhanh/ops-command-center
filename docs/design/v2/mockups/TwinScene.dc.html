<x-dc>

<canvas ref="{{h.setCanvas}}" role="img" aria-label="{{aria}}" style="position: absolute; left: 0; top: 0; width: {{w}}px; height: {{hgt}}px; touch-action: none; cursor: {{cursor}}; pointer-events: {{decorPe}}" onPointerDown="{{h.down}}" onPointerMove="{{h.move}}" onPointerUp="{{h.up}}" onPointerLeave="{{h.leave}}" onWheel="{{h.wheel}}" onContextMenu="{{h.ctx}}" onKeyDown="{{h.key}}" tabIndex="0"></canvas>

<sc-if value="{{tip.show}}" hint-placeholder-val="{{ false }}">
<div class="tw-tip" role="tooltip" data-severity="{{tip.sev}}" style="left: {{tip.left}}px; top: {{tip.top}}px; pointer-events: none">

</sc-if>

<sc-if value="{{chrome}}" hint-placeholder-val="{{ true }}"><p class="tw-drag-hint" style="right: {{hintRight}}px; {{hintPos}}"><svg class="ic ic-s" aria-hidden="true"><use href="#ts-move"></use></svg>Drag to rotate · <span class="kbd">Shift</span> + drag to pan</p></sc-if>

<sc-if value="{{chrome}}" hint-placeholder-val="{{ true }}"><div class="scene-ctrl" style="right: {{ctrlRight}}px">
<button class="compass" type="button" aria-label="Face north" onClick="{{h.north}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="transform: {{compass}}"><path class="n" d="M12 2 17 12H7z"></path><path d="M7 12h10l-5 10z" fill="#5a7488"></path></svg></button>
<div class="map-ctrl" role="group" aria-label="Camera">
<button type="button" aria-label="Zoom in" onClick="{{h.zoomIn}}"><svg class="ic" aria-hidden="true"><use href="#ts-plus"></use></svg></button>
<button type="button" aria-label="Zoom out" onClick="{{h.zoomOut}}"><svg class="ic" aria-hidden="true"><use href="#ts-minus"></use></svg></button>
<button type="button" aria-label="Rotate left" onClick="{{h.rotL}}"><svg class="ic" aria-hidden="true"><use href="#ts-rotl"></use></svg></button>
<button type="button" aria-label="Rotate right" onClick="{{h.rotR}}"><svg class="ic" aria-hidden="true"><use href="#ts-rotr"></use></svg></button>
<button type="button" aria-label="Reset view" onClick="{{h.reset}}"><svg class="ic" aria-hidden="true"><use href="#ts-home"></use></svg></button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["campus","tower","genset"],"default":"campus"},"view":{"editor":null},"beacons":{"editor":null},"states":{"editor":null},"tip":{"editor":null},"tips":{"editor":null},"leader":{"editor":null},"pin":{"editor":null},"pickOnGround":{"editor":null},"loading":{"editor":null},"loaded":{"editor":null},"allStale":{"editor":null},"insetRight":{"editor":null},"hintAt":{"editor":null},"focus":{"editor":null},"chrome":{"editor":null},"decor":{"editor":null},"spin":{"editor":null},"ui":{"editor":null},"heat":{"editor":null},"heatLabels":{"editor":null},"ctrlRight":{"editor":null},"aria":{"editor":null},"w":{"editor":null},"h":{"editor":null},"$preview":{"width":1072,"height":671}}'>
class Component extends DCLogic {
  // ------------------------------------------------------------ lifecycle
  componentDidMount() {
    this.ensure();
    this.request();
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (Number(this.props.spin) && !reduce && typeof requestAnimationFrame === 'function') {
      let last = 0;
      const step = (t) => {
        if (this.unmounted) return;
        if (last && !this.drag) { this.cam.yaw = (this.cam.yaw + (Number(this.props.spin) * (t - last)) / 1000) % 360; this.paint(); }
        last = t;
        this.spinRaf = requestAnimationFrame(step);
      };
      this.spinRaf = requestAnimationFrame(step);
    }
    if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.request());
  }

  componentWillUnmount() {
    this.unmounted = true;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.spinRaf) cancelAnimationFrame(this.spinRaf);
  }

  ensure() {
    if (this.scn) return;
    const p = this.props;
    this.W = Number(p.w) || 1072;
    this.H = Number(p.h) || 671;
    this.inset = Number(p.insetRight) || 0;
    this.scn = this.build(p.scene || 'campus');
    this.home = this.initialCam();
    this.cam = this.cloneCam(this.home);
    this.pin = p.pin ? p.pin.slice() : null;
    this.hover = null;
    this.sel = null;
    this.live = false;
    this.drag = null;
    this.tipView = { show: false };
    this.compassDeg = 0;
  }

  request() {
    if (this.raf) return;
    const run = () => {
      this.raf = 0;
      this.paint();
      this.setState({ v: ((this.state && this.state.v) || 0) + 1 });
    };
    this.raf = -1;
    const id = typeof requestAnimationFrame === 'function' ? requestAnimationFrame(run) : setTimeout(run, 16);
    if (this.raf === -1) this.raf = id;
  }

  // ------------------------------------------------------------ template values
  renderVals() {
    this.ensure();
    if (!this.h) this.h = this.makeHandlers();
    const ctrl = (this.props.ctrlRight != null ? Number(this.props.ctrlRight) : 12) + this.inset;
    return {
      w: this.W,
      hgt: this.H,
      tip: this.tipView,
      compass: 'rotate(' + this.compassDeg.toFixed(1) + 'deg)',
      ctrlRight: ctrl,
      hintRight: (this.props.hintAt || (this.inset ? 'top' : 'bottom')) === 'top' ? this.inset + 12 : ctrl + 52,
      hintPos: (this.props.hintAt || (this.inset ? 'top' : 'bottom')) === 'top' ? 'top: 12px; bottom: auto' : '',
      cursor: this.drag ? 'grabbing' : this.hover ? 'pointer' : 'grab',
      chrome: this.props.chrome !== false && !this.props.decor,
      decorPe: this.props.decor ? 'none' : 'auto',
      aria: this.props.aria || '3D view. Drag to rotate, shift and drag to pan, wheel to zoom.',
      h: this.h,
    };
  }

  makeHandlers() {
    const self = this;
    const pt = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      return [((e.clientX - r.left) * self.W) / r.width, ((e.clientY - r.top) * self.H) / r.height];
    };
    return {
      setCanvas: (el) => { if (el && el !== self.canvas) { self.canvas = el; self.request(); } },
      down: (e) => {
        const [x, y] = pt(e);
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
        self.drag = { x, y, x0: x, y0: y, pan: e.shiftKey || e.button === 2, moved: false };
        self.request();
      },
      move: (e) => {
        const [x, y] = pt(e);
        self.mouse = [x, y];
        const d = self.drag;
        if (d) {
          const dx = x - d.x, dy = y - d.y;
          if (Math.abs(x - d.x0) + Math.abs(y - d.y0) > 3) d.moved = true;
          d.x = x; d.y = y;
          if (d.pan) self.panBy(dx, dy);
          else {
            self.cam.yaw = (self.cam.yaw - dx * 0.4 + 360) % 360;
            self.cam.pitch = Math.max(20, Math.min(78, self.cam.pitch - dy * 0.3));
          }
          self.live = true;
          self.request();
          return;
        }
        const hit = self.pick(x, y);
        if (hit !== self.hover || self.tipView.show) { self.hover = hit; self.live = true; self.request(); }
      },
      up: (e) => {
        const d = self.drag;
        self.drag = null;
        if (e.currentTarget.releasePointerCapture) { try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ } }
        if (d && !d.moved) {
          const [x, y] = pt(e);
          if (self.props.pickOnGround) {
            const g = self.ground(x, y);
            if (g) self.pin = [g[0], g[1], 0];
          } else {
            const hit = self.pick(x, y);
            self.sel = hit && hit !== self.sel ? hit : null;
          }
          self.live = true;
        }
        self.request();
      },
      leave: () => { if (!self.drag) { self.hover = null; self.mouse = null; self.request(); } },
      wheel: (e) => {
        const [x, y] = pt(e);
        self.zoomAt(Math.exp(-e.deltaY * 0.0015), x, y);
      },
      ctx: (e) => { e.preventDefault(); },
      // Keys act only while the scene has focus, so they never fight the lists' arrows or Home.
      key: (e) => {
        const k = e.key, c = self.cam;
        if (e.shiftKey && k.indexOf('Arrow') === 0) {
          const d = 40, map = { ArrowLeft: [d, 0], ArrowRight: [-d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] };
          self.panBy(map[k][0], map[k][1]);
        } else if (k === 'ArrowLeft') c.yaw = (c.yaw + 15) % 360;
        else if (k === 'ArrowRight') c.yaw = (c.yaw + 345) % 360;
        else if (k === 'ArrowUp') c.pitch = Math.max(20, c.pitch - 5);
        else if (k === 'ArrowDown') c.pitch = Math.min(78, c.pitch + 5);
        else if (k === '+' || k === '=') { self.zoomAt(1.25); }
        else if (k === '-' || k === '_') { self.zoomAt(0.8); }
        else if (k === 'Home') { self.cam = self.cloneCam(self.home); }
        else if (k === 'Escape') { if (!self.sel) return; self.sel = null; }
        else return;
        e.preventDefault();
        self.live = true;
        self.request();
      },
      zoomIn: () => self.zoomAt(1.25),
      zoomOut: () => self.zoomAt(0.8),
      rotL: () => { self.cam.yaw = (self.cam.yaw + 30) % 360; self.request(); },
      rotR: () => { self.cam.yaw = (self.cam.yaw + 330) % 360; self.request(); },
      north: () => { self.cam.yaw = 0; self.request(); },
      reset: () => {
        self.cam = self.cloneCam(self.home);
        self.sel = null; self.live = false; self.hover = null;
        self.pin = self.props.pin ? self.props.pin.slice() : null;
        self.request();
      },
    };
  }

  // ------------------------------------------------------------ camera
  cloneCam(c) { return { yaw: c.yaw, pitch: c.pitch, s: c.s, T: c.T.slice(), sMin: c.sMin, sMax: c.sMax }; }

  basis(yaw, pitch) {
    const a = (yaw * Math.PI) / 180, t = (pitch * Math.PI) / 180;
    const hx = Math.sin(a), hy = Math.cos(a), st = Math.sin(t), ct = Math.cos(t);
    return { r: [hy, -hx, 0], u: [-ct * hx, -ct * hy, st], f: [-st * hx, -st * hy, -ct], c: [st * hx, st * hy, ct], h: [hx, hy], ct: ct };
  }

  center() { return [(this.W - this.inset) / 2, this.H / 2]; }

  proj(p, B, cam) {
    const v0 = p[0] - cam.T[0], v1 = p[1] - cam.T[1], v2 = p[2] - cam.T[2];
    const [cx, cy] = this.center();
    return [
      cx + cam.s * (v0 * B.r[0] + v1 * B.r[1] + v2 * B.r[2]),
      cy - cam.s * (v0 * B.u[0] + v1 * B.u[1] + v2 * B.u[2]),
      v0 * B.f[0] + v1 * B.f[1] + v2 * B.f[2],
    ];
  }

  fitScale(yaw, pitch, T) {
    const B = this.basis(yaw, pitch);
    const [[x0, y0, z0], [x1, y1, z1]] = this.scn.bounds;
    let mx = 1e-6, my = 1e-6;
    for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) {
      const v = [x - T[0], y - T[1], z - T[2]];
      mx = Math.max(mx, Math.abs(v[0] * B.r[0] + v[1] * B.r[1] + v[2] * B.r[2]));
      my = Math.max(my, Math.abs(v[0] * B.u[0] + v[1] * B.u[1] + v[2] * B.u[2]));
    }
    return Math.min(((this.W - this.inset) / 2) * 0.94 / mx, (this.H / 2) * 0.94 / my);
  }

  initialCam() {
    const v = this.props.view || {};
    const yaw = v.yaw != null ? v.yaw : 45, pitch = v.pitch != null ? v.pitch : 55;
    const T = v.target ? v.target.slice() : this.scn.center.slice();
    const fit = this.fitScale(yaw, pitch, this.scn.center);
    const s = fit * (v.zoom || 1);
    return { yaw, pitch, T, s, sMin: fit * 0.6, sMax: fit * this.scn.maxZoom };
  }

  ground(x, y) {
    const cam = this.cam, B = this.basis(cam.yaw, cam.pitch);
    const [cx, cy] = this.center();
    const a = (x - cx) / cam.s, b = -(y - cy) / cam.s;
    const base = [cam.T[0] + a * B.r[0] + b * B.u[0], cam.T[1] + a * B.r[1] + b * B.u[1], cam.T[2] + a * B.r[2] + b * B.u[2]];
    if (Math.abs(B.f[2]) < 1e-6) return null;
    const t = -base[2] / B.f[2];
    return [base[0] + t * B.f[0], base[1] + t * B.f[1]];
  }

  clampTarget() {
    const [x0, x1, y0, y1] = this.scn.pan;
    const T = this.cam.T;
    T[0] = Math.max(x0, Math.min(x1, T[0]));
    T[1] = Math.max(y0, Math.min(y1, T[1]));
  }

  panBy(dx, dy) {
    const cam = this.cam, B = this.basis(cam.yaw, cam.pitch), s = cam.s, k = 1 / Math.max(B.ct, 0.25);
    cam.T[0] += (-dx * B.r[0]) / s - (dy * B.h[0] * k) / s;
    cam.T[1] += (-dx * B.r[1]) / s - (dy * B.h[1] * k) / s;
    this.clampTarget();
  }

  zoomAt(f, x, y) {
    const cam = this.cam;
    const before = x != null ? this.ground(x, y) : null;
    cam.s = Math.max(cam.sMin, Math.min(cam.sMax, cam.s * f));
    if (before) {
      const after = this.ground(x, y);
      if (after) { cam.T[0] += before[0] - after[0]; cam.T[1] += before[1] - after[1]; this.clampTarget(); }
    }
    this.live = true;
    this.request();
  }

  // ------------------------------------------------------------ geometry helpers
  box(id, node, b, m, o) {
    const [x0, x1, y0, y1, z0, z1] = b;
    const F = {
      t: { pts: [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], n: [0, 0, 1] },
      s: { pts: [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]], n: [0, 1, 0] },
      n: { pts: [[x1, y0, z1], [x0, y0, z1], [x0, y0, z0], [x1, y0, z0]], n: [0, -1, 0] },
      e: { pts: [[x1, y1, z1], [x1, y0, z1], [x1, y0, z0], [x1, y1, z0]], n: [1, 0, 0] },
      w: { pts: [[x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [x0, y0, z0]], n: [-1, 0, 0] },
    };
    const faces = ['t', 's', 'n', 'e', 'w'].map((k) => Object.assign({ key: k }, F[k]));
    return Object.assign({ id, node, m: m || 'part', faces, lines: [], c: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2] }, o || {});
  }

  prism(id, node, cx, cy, r0, r1, z0, z1, m, o) {
    const N = (o && o.seg) || 16, faces = [];
    const dz = (r0 - r1) / Math.max(z1 - z0, 1e-6);
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2, b = ((i + 1) / N) * Math.PI * 2, mm = (a + b) / 2;
      faces.push({ key: 'side', soft: true, n: [Math.cos(mm), Math.sin(mm), dz], pts: [
        [cx + r0 * Math.cos(a), cy + r0 * Math.sin(a), z0], [cx + r0 * Math.cos(b), cy + r0 * Math.sin(b), z0],
        [cx + r1 * Math.cos(b), cy + r1 * Math.sin(b), z1], [cx + r1 * Math.cos(a), cy + r1 * Math.sin(a), z1]] });
    }
    const top = [];
    for (let i = 0; i < N; i++) { const a = (i / N) * Math.PI * 2; top.push([cx + r1 * Math.cos(a), cy + r1 * Math.sin(a), z1]); }
    faces.push({ key: 't', n: [0, 0, 1], pts: top, color: o && o.topColor });
    return Object.assign({ id, node, m: m || 'part', faces, lines: [], c: [cx, cy, (z0 + z1) / 2] }, o || {});
  }

  flatPoly(id, node, pts, m, n, o) {
    const c = [0, 0, 0];
    for (const p of pts) { c[0] += p[0] / pts.length; c[1] += p[1] / pts.length; c[2] += p[2] / pts.length; }
    return Object.assign({ id, node, m, faces: [{ key: 'p', n, pts, color: o && o.color }], lines: [], c }, o || {});
  }

  lineObj(id, node, segs, color, w, o) {
    const c = [0, 0, 0];
    let k = 0;
    for (const s of segs) for (const p of s) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; k++; }
    return Object.assign({ id, node, m: 'line', faces: [], lines: [{ segs, color, w }], c: [c[0] / k, c[1] / k, c[2] / k] }, o || {});
  }

  ring(cx, cy, r, z, n) {
    const segs = [];
    n = n || 24;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, b = ((i + 1) / n) * Math.PI * 2;
      segs.push([[cx + r * Math.cos(a), cy + r * Math.sin(a), z], [cx + r * Math.cos(b), cy + r * Math.sin(b), z]]);
    }
    return segs;
  }

  blades(id, node, cx, cy, r, z, parent) {
    const out = [];
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.3;
      const p = (rr, da) => [cx + rr * Math.cos(a + da), cy + rr * Math.sin(a + da), z];
      out.push(this.flatPoly(id + '-b' + i, node, [p(r * 0.2, -0.45), p(r * 0.95, -0.1), p(r * 0.97, 0.16), p(r * 0.2, 0.42)], 'blade', [0, 0, 1], { parent }));
    }
    const hub = [];
    for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2; hub.push([cx + r * 0.2 * Math.cos(a), cy + r * 0.2 * Math.sin(a), z + 0.01]); }
    out.push(this.flatPoly(id + '-hub', node, hub, 'hub', [0, 0, 1], { parent: id + '-b5' }));
    return out;
  }

  rail(id, node, path, z, parent) {
    const segs = [];
    for (const h of [0.55, 1.1]) for (let i = 0; i < path.length - 1; i++) segs.push([[path[i][0], path[i][1], z + h], [path[i + 1][0], path[i + 1][1], z + h]]);
    for (let i = 0; i < path.length - 1; i++) {
      const [ax, ay] = path[i], [bx, by] = path[i + 1];
      const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / 2));
      for (let k = 0; k <= n; k++) { const x = ax + ((bx - ax) * k) / n, y = ay + ((by - ay) * k) / n; segs.push([[x, y, z], [x, y, z + 1.1]]); }
    }
    return this.lineObj(id, node, segs, '#8199aa', 1, { parent });
  }

      const a = P(S.anchors[node]);
      left = a[0] - 16 - 256; top = a[1] - 70;
    }
    if (!node) return { show: false };
    const fallback = { name: S.names[node] || '', code: '', foot: p.pickOnGround ? 'Click to place the incident here' : 'Click to select' };
    const t = Object.assign({}, fallback, tips[node] || {}, p.tip && p.tip.node === node && !this.live ? p.tip : {});
    if (!t.name) return { show: false };
    const rows = (t.rows || []).map((r) => ({ icon: r[0], label: r[1], val: r[2] }));
    left = Math.max(8, Math.min(this.W - this.inset - 264, left));
    top = Math.max(60, Math.min(this.H - 170, top));
    return {
      show: true, left: Math.round(left), top: Math.round(top), name: t.name, code: t.code || '', sev: t.sev || '',
      hasState: !!t.state, stateKey: t.state ? t.state[0] : '', stateIcon: t.state ? t.state[1] : '', stateLabel: t.state ? t.state[2] : '',
      hasRows: rows.length > 0, rows, foot: t.foot || 'Click to select',
    };
  }
}
