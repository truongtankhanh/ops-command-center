<header class="hdr">
<div class="brand">
<svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#223848"></rect><circle cx="16" cy="16" r="9" fill="none" stroke="#e4edf3" stroke-width="2"></circle><circle cx="16" cy="16" r="3.5" fill="#8c9bff"></circle></svg>
<div>
<h1 class="brand-name">Ops Command Center</h1>
<button class="brand-site" type="button">Langbiang Tech Campus<svg class="ic ic-s" aria-hidden="true"><use href="#i-chevron"></use></svg></button>
</div>
</div>
<ul class="kpis" aria-label="Active incidents by severity — select to filter the feed">
<li><button class="kpi" type="button" data-severity="critical" data-zero="true" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-critical"></use></svg><span class="kpi-n">0</span><span class="kpi-label">Critical</span></button></li>
<li><button class="kpi" type="button" data-severity="high" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-high"></use></svg><span class="kpi-n">2</span><span class="kpi-label">High</span></button></li>
<li><button class="kpi" type="button" data-severity="medium" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-medium"></use></svg><span class="kpi-n">4</span><span class="kpi-label">Medium</span></button></li>
<li><button class="kpi" type="button" data-severity="low" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-low"></use></svg><span class="kpi-n">2</span><span class="kpi-label">Low</span></button></li>
</ul>
<div class="spacer"></div>
<span class="conns">
<span class="conn" data-state="live" role="status"><svg class="ic ic-s" aria-hidden="true"><use href="#i-live"></use></svg>Live</span>
<span class="conn" data-state="live" role="status"><svg class="ic ic-s" aria-hidden="true"><use href="#i-activity"></use></svg>Telemetry</span>
</span>
<time class="clock" datetime="2026-10-08T15:42:00+07:00"><span class="clock-time">15:42</span><span class="clock-date">Thu 8 Oct · GMT+7</span></time>
<button class="btn btn-primary" type="button" aria-expanded="false" aria-controls="report-incident-panel"><svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg>Report incident<span class="kbd">N</span></button>
<button class="user" type="button" aria-haspopup="menu" aria-expanded="false"><span class="avatar">DO</span><span><span class="user-name">Demo Operator</span><span class="user-role">Operator</span></span><svg class="ic ic-s" aria-hidden="true"><use href="#i-chevron"></use></svg></button>
</header>

<main class="workspace">
<aside class="feed" aria-label="Incidents and assets">
<div class="panel-switch" role="tablist" aria-label="Side panel">
<button type="button" role="tab" aria-selected="false" tabindex="-1">Incidents <span class="count">8</span></button>
<button type="button" role="tab" aria-selected="true">Assets <span class="count">19</span></button>
</div>
<div class="feed-top">
<label class="search"><span class="sprite">Search assets</span><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg><input type="search" placeholder="Search asset, code or zone"><span class="kbd">/</span></label>
</div>
<div class="tabs" role="tablist" aria-label="Filter assets">
<button class="tab" role="tab" type="button" aria-selected="true">All <span class="count">19</span></button>
<button class="tab" role="tab" type="button" aria-selected="false" tabindex="-1">Faults <span class="count">1</span></button>
<button class="tab" role="tab" type="button" aria-selected="false" tabindex="-1">No data <span class="count">1</span></button>
</div>
<ul class="feed-list" role="tabpanel" aria-label="Assets by zone">
<sc-for list="{{assets}}" as="a" hint-placeholder-count="8">
<li>
<sc-if value="{{a.group}}" hint-placeholder-val="{{ false }}"><p class="asset-group">{{a.group}}</p></sc-if>
<button class="asset-row" type="button" aria-current="{{a.current}}" style="{{a.style}}" data-severity="{{a.sev}}">
<span class="asset-ic"><svg class="ic" aria-hidden="true"><use href="#i-{{a.icon}}"></use></svg></span>
<span class="asset-name">{{a.name}}</span>
<span class="asset-val">{{a.val}}</span>
<span class="asset-meta"><span class="dstate" data-state="{{a.state}}"><svg class="ic" aria-hidden="true"><use href="#i-{{a.stateIcon}}"></use></svg>{{a.stateLabel}}</span><span class="code">{{a.code}}</span></span>
</button>
</li>
</sc-for>
</ul>
</aside>

<div class="stage">
<section class="twin" aria-label="Campus 3D view">
<div style="position: absolute; left: 0; top: 0">
<dc-import scene="campus" name="TwinScene" w="1072" h="671" view="{{view}}" states="{{states}}" tip="{{tip}}" beacons="{{beacons}}" aria="3D view zoomed on the Data Center; cooling tower 1 highlighted. Drag to rotate." hint-size="1072px,671px"></dc-import>
</div>

<div class="tw-tools">
<div class="viewseg" role="group" aria-label="View"><button type="button" aria-pressed="true"><svg class="ic ic-s" aria-hidden="true"><use href="#i-box"></use></svg>3D</button><button type="button" aria-pressed="false"><svg class="ic ic-s" aria-hidden="true"><use href="#i-map"></use></svg>2D</button></div>
<div class="layers" role="group" aria-label="Layers"><span>Show</span><button class="layer" type="button" aria-pressed="true"><i class="tick"></i>Incidents</button><button class="layer" type="button" aria-pressed="true"><i class="tick"></i>Cameras</button><button class="layer" type="button" aria-pressed="false"><i class="tick"></i>Heat</button></div>
</div>
</section>

<section class="cams" aria-label="Cameras">
<figure class="cam is-linked">
<div class="scene scene-b"><div class="block lit" style="left: 8%; top: 25%; width: 34%; height: 30%"></div><div class="block" style="left: 64%; top: 36%; width: 22%; height: 19%"></div></div>
<div class="cam-top"><span class="live"><i></i>LIVE</span><span class="cam-code">CAM-D01</span></div>
<figcaption class="cam-bot"><span><span class="cam-name">Data center roof</span><br><span class="cam-zone">Data Center</span></span><span class="cam-time">15:42:07</span></figcaption>
</figure>
<figure class="cam">
<div class="cam-off"><svg class="ic ic-l" aria-hidden="true"><use href="#i-video-off"></use></svg><strong>No signal</strong><span>CAM-D02 · since 14:38</span></div>
</figure>
<figure class="cam">
<div class="scene scene-a"><div class="block lit" style="left: 18%; top: 22%; width: 26%; height: 20%"></div><div class="block" style="left: 58%; top: 28%; width: 18%; height: 14%"></div></div>
<div class="cam-top"><span class="live"><i></i>LIVE</span><span class="cam-code">CAM-D03</span></div>
<figcaption class="cam-bot"><span><span class="cam-name">Data center east yard</span><br><span class="cam-zone">Data Center</span></span><span class="cam-time">15:42:07</span></figcaption>
</figure>
<figure class="cam">
<div class="scene scene-d"><div class="block lit" style="left: 12%; top: 26%; width: 20%; height: 22%"></div><div class="block lit" style="left: 70%; top: 26%; width: 20%; height: 22%"></div></div>
<div class="cam-top"><span class="live"><i></i>LIVE</span><span class="cam-code">CAM-L01</span></div>
<button class="cam-expand" type="button" aria-label="Open CAM-L01 in the viewer"><svg class="ic ic-s" aria-hidden="true"><use href="#i-expand"></use></svg></button>
<figcaption class="cam-bot"><span><span class="cam-name">Library east entrance</span><br><span class="cam-zone">Library</span></span><span class="cam-time">15:42:07</span></figcaption>
</figure>
</section>
</div>
</main>
</div>
</x-dc>

    const states = { running: ['activity', 'Running'], standby: ['pause', 'Standby'], stale: ['clock', 'No data since 15:20'], fault: ['medium', 'Fault · INC-000108'] };
    const a = (r) => ({ group: '', current: 'false', style: '', sev: '', ...r, stateIcon: states[r.state][0], stateLabel: states[r.state][1] });
    return {
      view: { target: [172, -45, 14], zoom: 4.5 },
      states: { CT01: 'hover' },
      tip: { node: 'CT01' },
      beacons: [
        { p: [150, -200, 16], sev: 'high', icon: 'fire_alarm', fill: true },
        { p: [-100, -38, 0], sev: 'high', icon: 'intrusion', fill: true },
        { p: [205, 180, 20], sev: 'medium', icon: 'water_leak' },
        { p: [122, 112, 0], sev: 'medium', icon: 'suspicious_object' },
        { p: [-40, -208, 14], sev: 'medium', icon: 'injury' },
        { p: [197, -25, 0], sev: 'medium', icon: 'equipment_fault' },
        { p: [185, 140, 0], sev: 'low', icon: 'blocked_access', fill: true },
        { p: [0, 248, 0], sev: 'low', icon: 'crowding', fill: true }

      assets: [
        a({ group: 'Data Center', code: 'CT-01', name: 'Cooling tower 1', icon: 'fan', state: 'running', val: '1,420 rpm', style: 'background: var(--surface-2); border-color: var(--border-strong)' }),
        a({ code: 'CT-02', name: 'Cooling tower 2', icon: 'fan', state: 'standby', val: '0 rpm' }),
        a({ code: 'UPS-01', name: 'UPS room', icon: 'zap', state: 'running', val: '38 %' }),
        a({ code: 'GEN-01', name: 'Standby generator', icon: 'power', state: 'standby', val: '86 % fuel' }),
        a({ group: 'Utility Plant', code: 'TR-01', name: 'Main transformer', icon: 'zap', state: 'running', val: '62 %' }),
        a({ code: 'SWG-01', name: 'Main switchgear', icon: 'power', state: 'running', val: '22 kV' }),
        a({ code: 'CH-01', name: 'Chiller 1', icon: 'thermo', state: 'running', val: '6.8 °C' }),
        a({ group: 'Dormitory B', code: 'LKS-B3', name: 'Leak sensor, level 3', icon: 'droplet', state: 'fault', sev: 'medium', val: 'Wet' }),
        a({ code: 'LFT-B1', name: 'Lift 1', icon: 'lift', state: 'running', val: 'Floor 2' }),
        a({ group: 'Dormitory A', code: 'LFT-A2', name: 'Lift 2', icon: 'lift', state: 'running', val: 'Floor 4' }),
        a({ group: 'Science Lab', code: 'FH-L1', name: 'Fume hoods, level 2', icon: 'fan', state: 'running', val: '0.5 m/s' }),
        a({ code: 'GAS-L1', name: 'Gas detector', icon: 'activity', state: 'running', val: '0 ppm' }),
        a({ group: 'Health Clinic', code: 'AHU-C1', name: 'Air handler', icon: 'thermo', state: 'running', val: '22.5 °C' }),
        a({ group: 'Library', code: 'AHU-L1', name: 'Air handler, level 1', icon: 'thermo', state: 'running', val: '21.4 °C' }),
        a({ group: 'Innovation Hub', code: 'AHU-H1', name: 'Air handler, roof', icon: 'thermo', state: 'running', val: '22.0 °C' }),
        a({ code: 'LFT-H1', name: 'Passenger lift', icon: 'lift', state: 'running', val: 'Floor 3' }),
        a({ group: 'Main Gate', code: 'BAR-01', name: 'Barrier arm, inbound', icon: 'gate', state: 'running', val: 'Up' }),
        a({ group: 'East Gate', code: 'BAR-02', name: 'Barrier arm, service', icon: 'gate', state: 'standby', val: 'Down' }),
        a({ group: 'Student Center', code: 'PMP-S1', name: 'Booster pump', icon: 'activity', state: 'stale', val: '—' })

  }
}
</script>
</body>
</html>
