</div>
<ul class="feed-list" role="tabpanel" aria-label="Active incidents">
<sc-for list="{{rows}}" as="item" hint-placeholder-count="8">
<li>
<button class="row" type="button" data-severity="{{item.sev}}" data-status="{{item.status}}" aria-current="false">
<span class="sev-ic" title="{{item.sevLabel}}"><svg class="ic" aria-hidden="true"><use href="#i-{{item.sev}}"></use></svg><span class="sprite">{{item.sevLabel}} severity</span></span>
<span class="row-title"><svg class="ic ic-s" aria-hidden="true"><use href="#i-{{item.type}}"></use></svg><span class="sprite">{{item.typeLabel}}: </span>{{item.title}}</span>
<time class="row-age">{{item.age}}</time>
<span class="row-meta">
<span class="status" data-status="{{item.status}}"><svg class="ic" aria-hidden="true"><use href="#i-{{item.status}}"></use></svg>{{item.statusLabel}}</span>
<span class="sep">·</span>
<span>{{item.zone}}</span>
<span class="code" style="margin-left: auto">{{item.code}}</span>
</span>
</button>
</li>
</sc-for>
</ul>
</aside>
