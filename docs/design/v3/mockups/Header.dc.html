<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./v3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:1440px;height:72px;font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:18px;color:#e7f2ff">
<div class="hdr">
<div class="brand">
<div class="logo"><svg class="ic xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></div>
<div>
<div class="sb" style="font-size:16px;line-height:20px">Ops Command Center</div>
<div class="t2 s12">Langbiang Tech Campus</div>
</div>
</div>
<div class="kpis" role="group" aria-label="Open incidents by severity">
<button class="kpi crit {{hotClass}}" style="font:inherit;color:inherit;text-align:left;cursor:pointer" aria-pressed="false">
<svg class="ic xl" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
<span><span class="v" style="display:block">{{crit}}</span><span class="l">Critical</span></span>
</button>
<button class="kpi high" style="font:inherit;color:inherit;text-align:left;cursor:pointer" aria-pressed="false">
<svg class="ic xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16h.01"/><path d="M12 8v4"/><path d="M15.312 2a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586l-4.688-4.688A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2z"/></svg>
<span><span class="v" style="display:block">1</span><span class="l">High</span></span>
</button>
<button class="kpi med" style="font:inherit;color:inherit;text-align:left;cursor:pointer" aria-pressed="false">
<svg class="ic xl" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
<span><span class="v" style="display:block">2</span><span class="l">Medium</span></span>
</button>
<button class="kpi low" style="font:inherit;color:inherit;text-align:left;cursor:pointer" aria-pressed="false">
<svg class="ic xl" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
<span><span class="v" style="display:block">4</span><span class="l">Low</span></span>
</button>
</div>
<div style="flex:1"></div>
<div class="row" style="gap:8px">
<span class="pill live"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>Live</span>
<sc-if value="{{isLive}}" hint-placeholder-val="{{ true }}">
<span class="pill live"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>Telemetry</span>
</sc-if>
<sc-if value="{{isPaused}}" hint-placeholder-val="{{ false }}">
<span class="pill warn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>Telemetry paused</span>
</sc-if>
</div>
<div class="clock" style="text-align:right;padding:0 8px">
<div class="t">15:42</div>
<div class="t2 xs">Wed 21 Oct · GMT+7</div>
</div>
<sc-if value="{{canReport}}" hint-placeholder-val="{{ true }}">
<button class="btn p" style="width:176px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Report incident<span class="kbd">N</span></button>
</sc-if>
<div class="acct">
<div class="av">{{initials}}</div>
<div>
<div class="md">{{who}}</div>
<div class="t2 xs">{{role}}</div>
</div>
<svg class="ic s t2" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hot":{"editor":"boolean","default":false},"paused":{"editor":"boolean","default":false},"viewer":{"editor":"boolean","default":false},"crit":{"editor":"int","default":1},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const viewer = !!this.props.viewer;
const paused = !!this.props.paused;
return {
hotClass: this.props.hot ? 'hot' : '',
isPaused: paused,
isLive: !paused,
canReport: !viewer,
crit: this.props.crit ?? 1,
who: viewer ? 'Demo Viewer' : 'Demo Operator',
role: viewer ? 'View only' : 'Operator',
initials: viewer ? 'DV' : 'DO'
};
}
}
</script>
</body>
</html>
