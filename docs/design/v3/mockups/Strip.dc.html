<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera strip</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./v3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:1056px;height:{{boxH}}px;font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:18px;color:#e7f2ff">
<div class="strip panel" style="left:0;top:0;height:{{boxH}}px;gap:8px;padding:{{pad}}">
<div class="row" style="gap:12px;height:28px">
<svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
<span class="sb" style="font-size:14px">Camera feeds</span>
<span class="chip {{allOn}}">All <span class="n">5</span></span>
<span class="chip">Live <span class="n">4</span></span>
<span class="chip {{offOn}}"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2l20 20"/><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14"/><path d="M22 18V9a2 2 0 0 0-2-2h-3l-2.5-3"/></svg>Offline <span class="n">1</span></span>
<div style="flex:1"></div>
<span class="btn s ghost" style="height:28px;font-size:12px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>View all</span>
<span class="ibtn" style="width:28px;height:28px" aria-label="{{collapseLabel}}"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="{{chev}}"/></svg></span>
</div>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div class="tiles">
<sc-if value="{{showLive}}" hint-placeholder-val="{{ true }}">
<div class="cam {{firstClass}}">
<div class="th feed-a"><span class="live"><i></i>LIVE</span><span class="cd">CAM-L03</span><span class="tm">15:42:07</span></div>
<div class="nm">Science Lab, level 2</div>
</div>
<div class="cam">
<div class="th feed-b"><span class="live"><i></i>LIVE</span><span class="cd">CAM-H01</span><span class="tm">15:42:07</span></div>
<div class="nm">Service corridor</div>
</div>
<div class="cam">
<div class="th feed-c"><span class="live"><i></i>LIVE</span><span class="cd">CAM-R02</span><span class="tm">15:42:07</span></div>
<div class="nm">Dormitory B lobby</div>
</div>
<div class="cam">
<div class="th feed-d"><span class="live"><i></i>LIVE</span><span class="cd">CAM-S01</span><span class="tm">15:42:07</span></div>
<div class="nm">Main gate inbound</div>
</div>
</sc-if>
<div class="cam">
<div class="th feed-off"><span class="live" style="color:#a9bed6"><i style="background:#5a7488"></i>OFFLINE</span><span class="cd">CAM-D03</span><div style="position:absolute;left:0;right:0;top:34px;text-align:center;color:#a9bed6;font-size:12px">No signal</div></div>
<div class="nm">Data center perimeter</div>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"open","options":["open","collapsed"]},"filter":{"editor":"enum","default":"all","options":["all","offline"]},"first":{"editor":"boolean","default":false},"$preview":{"width":1056,"height":170}}'>
class Component extends DCLogic {
renderVals() {
const open = (this.props.mode ?? 'open') !== 'collapsed';
const offline = (this.props.filter ?? 'all') === 'offline';
return {
open: open,
boxH: open ? 170 : 48,
pad: open ? '10px 12px' : '9px 12px',
showLive: !offline,
allOn: offline ? '' : 'on',
offOn: offline ? 'on' : '',
firstClass: this.props.first ? 'first' : '',
chev: open ? 'm6 9 6 6 6-6' : 'm18 15-6-6-6 6',
collapseLabel: open ? 'Collapse camera strip' : 'Expand camera strip'
};
}
}
</script>
</body>
</html>
